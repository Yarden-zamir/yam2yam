services:
  site:
    build: .
    pull_policy: build
    environment:
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_SOCKET_DIR: ${KITSHN_SOCKET_DIR}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
      - logdata:/data:ro
    networks:
      - kitshn-edge
      - default
    depends_on:
      - uploader
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # trip-log pictures: receives uploads, resizes, keeps the index; shares the volume with the site
  uploader:
    build: ./uploader
    pull_policy: build
    environment:
      LOG_EDITORS: ${LOG_EDITORS:-}   # from .env (written by src/build.py from trek.json "editors"): the GitHub logins allowed to edit
    volumes:
      - logdata:/data
    restart: unless-stopped

  # GitHub sign-in for editing, the same gate as the other recipes: oauth2-proxy owns /auth/* on the site, and Caddy
  # sends the editing routes through forward_auth to it. Runs only when .env turns the "auth" profile on (a trek with
  # "editors" in trek.json). Params (GitHub repo settings, the KITSHN_ prefix stripped by KitSHn):
  #   OAUTH2_PROXY_CLIENT_ID      var:    GitHub OAuth app client id
  #   OAUTH2_PROXY_CLIENT_SECRET  secret: GitHub OAuth app client secret
  #   OAUTH2_PROXY_COOKIE_SECRET  secret: 32 random bytes, base64 (openssl rand -base64 32)
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    profiles: ["auth"]
    command:
      - --http-address=0.0.0.0:4180
      - --provider=github
      - --proxy-prefix=/auth
      - --redirect-url=https://${SITE_HOST:-localhost}/auth/callback
      - --whitelist-domain=${SITE_HOST:-localhost}
      - --reverse-proxy=true
      # anyone with a GitHub account may sign in; who may edit is the uploader's LOG_EDITORS list
      - --email-domain=*
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=720h
      - --cookie-refresh=0
      - --upstream=static://202
    environment:   # empty when the profile is off; oauth2-proxy itself refuses to start without them
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    restart: unless-stopped

volumes:
  logdata:

networks:
  kitshn-edge:
    external: true
