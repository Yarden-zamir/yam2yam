services:
  site:
    build: .
    pull_policy: build
    environment:
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_SOCKET_DIR: ${KITSHN_SOCKET_DIR}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
      - logdata:/data:ro
    networks:
      - kitshn-edge
      - default
    depends_on:
      - uploader
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # trip-log pictures: receives uploads, resizes, keeps the index; shares the volume with the site
  uploader:
    build: ./uploader
    pull_policy: build
    volumes:
      - logdata:/data
    restart: unless-stopped

volumes:
  logdata:

networks:
  kitshn-edge:
    external: true
