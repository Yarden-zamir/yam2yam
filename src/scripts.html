<script>
(function(){
  var btn=document.getElementById('langbtn'),en=document.getElementById('en'),he=document.getElementById('he');
  function apply(l,store){
    var isHe=l==='he';
    en.hidden=isHe; he.hidden=!isHe;
    btn.textContent=isHe?'English':'עברית';
    btn.setAttribute('lang',isHe?'en':'he');
    document.documentElement.setAttribute('dir',isHe?'rtl':'ltr');
    var fab=document.getElementById('locfab');if(fab){var t=fab.getAttribute('data-label-'+l)||'';fab.setAttribute('aria-label',t);fab.title=t;}
    if(store){
      try{localStorage.setItem(((window.TREK&&window.TREK.slug)||'trek')+'-lang',l)}catch(e){}
      try{var u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(history.state,'',u)}catch(e){}
    }
  }
  /* a shared link carries its language; otherwise the reader's own choice */
  var saved='en',fromUrl=null;
  try{fromUrl=new URL(location.href).searchParams.get('lang')}catch(e){}
  try{saved=localStorage.getItem(((window.TREK&&window.TREK.slug)||'trek')+'-lang')||'en'}catch(e){}
  apply(fromUrl==='he'||fromUrl==='en'?fromUrl:saved,false);
  btn.addEventListener('click',function(){apply(en.hidden?'en':'he',true);if(window.gr52Mast)window.gr52Mast.refresh();});
})();
(function(){/* the cover masthead: --sbw lets it span the viewport exactly; on scroll the picture drifts at 0.6x of the page and zooms a little, and the masthead fades once a third of it has gone */
  var de=document.documentElement,still=matchMedia('(prefers-reduced-motion: reduce)').matches,raf=0;
  function sbw(){de.style.setProperty('--sbw',(window.innerWidth-de.clientWidth)+'px');}
  function frame(){raf=0;var y=window.scrollY||0;document.querySelectorAll('.mast').forEach(function(m){var h=m.offsetHeight;if(!h)return;var t=Math.min(y,h),k=t/h;m.style.setProperty('--py',(t*0.6).toFixed(1)+'px');m.style.setProperty('--pz',(1+k*0.12).toFixed(3));m.style.setProperty('--pf',Math.max(0,1-Math.max(0,k-0.3)/0.65).toFixed(3));});}
  function tick(){if(!raf)raf=requestAnimationFrame(frame);}
  sbw();window.addEventListener('resize',function(){sbw();tick();});
  if(!still){window.addEventListener('scroll',tick,{passive:true});document.addEventListener('DOMContentLoaded',tick);tick();}
  window.gr52Mast={refresh:tick};

})();
</script>
<script>
if('serviceWorker' in navigator){(function(){var had=!!navigator.serviceWorker.controller,done=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!done){done=true;location.reload();}});})();}
</script>
