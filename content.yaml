he:
  eyebrow: ים אל ים · הגליל העליון · 10–13 בספטמבר 2026
  title: ים אל ים עם אוהל
  lede: ירדן ואיילת ישנים ב-Achziv ביום רביעי 9 בספטמבר, הולכים ארבעה ימים מזרחה מהים התיכון דרך Har Meron עד הכנרת עם אוהל, וחוזרים הביתה מ-Ginosar ביום ראשון 13 בספטמבר, היום השני של ראש השנה. החלוקה לימים, חוקי החניונים, המים, החום, ושעות השער של Nahal Amud שמכתיבות את יום 3 ויום 4.
  facts:
