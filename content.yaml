    text:
    - 'גבעות הגליל, בלי שערים של שמורות. יורדים ל-Elkosh bridge על כביש 89 (ק"מ 29, חנות בתחנת הדלק 200 מטר, בחניון הלא רשמי והפופולרי שם אין מים), ואז עולים בוואדי דרך שרשרת של מעיינות קטנים: עין רטט, עין טבעת, עין זבול ו-Ein Hotam (ק"מ 33, צלול עם בריכה). Hurfeish (ק"מ 34) נמצא 1.5 ק"מ צפונית לקו אם צריך חנות או בית קפה; זה כפר דרוזי, פתוח בשישי ובראש השנה. האוטובוסים בכביש 89 נעצרים היום בסביבות 14:00 לשבת ולחג: מ-Elkosh bridge והלאה אין אוטובוס עד ראשון בערב. אחר הצהריים מטפסים בהדרגה עד רגלי Har Meron. Horbat Hammama הוא החניון הכי טוב במסלול: שולחנות בין העצים, ברז, שירותים, ומותר להדליק מדורה במקומות המסומנים. זה גם הלילה הכי קריר, 15–18 מעלות ב-886 מטר בשטח פתוח. בבית ספר שדה Har Meron ליד יש חניון בתשלום עם מטבח ומקלחות אם התחזית מתהפכת.'
