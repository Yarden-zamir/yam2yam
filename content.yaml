    text:
    - 'רגליים בים ב-06:00, ואז מזרחה בדרכים חקלאיות עד הכניסה לשמורת Nahal Kziv ב-Ein Hardalit (ק"מ 8, בריכות מוצלות, ברז בחניון). הנחל זורם כל השנה אבל רט"ג אומרים לא לשתות ממנו: ממלאים בברז של Yad LeYad וב-Ein Hardalit. השביל מטפס ל-Montfort, המבצר הצלבני על השלוחה (ק"מ 12, מדרגות וטיפוס קצר, אסור לישון בשמורה), יורד חזרה למים ועוקב אחריהם דרך בריכת הדלבים עד Ein Tamir (ק"מ 16), מעיין בקצה נקבה חצובה שאפשר ללכת בה עם פנס. ואז העלייה היחידה של היום: 300 מטר למעלה דרך Ein Ziv עד הכפר Abirim. חניון הלילה בכניסה לכפר, עם ברז ופח ולא יותר. יום חמישי הוא יום רגיל: עדיין יש אוטובוסים בכביש 89 מתחת לכפר אם משהו משתבש; משישי בצהריים הם נעצרים לסוף השבוע של החג. <b>מאחרים?</b> פארק Goren (קק"ל, חינם, ברז, שירותים) יושב מעל Montfort בק"מ 14, 300 מטר מהקו.'
