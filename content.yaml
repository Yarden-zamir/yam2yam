    - 5–6 h
    - חניון רט"ג בתשלום, הזמנה באתר, קבלה 15:00–19:00
    text:
    - 'היום הקצר, בכוונה: שמורת Nahal Amud מכניסה מטיילים מ-Pitul Meron רק בין 08:00 ל-14:30, וסוגרת את השבילים ב-16:00, אז הקניון מחכה לבוקר. 300 מטר עלייה מהחניון לרמת הפסגה של Har Meron (1,204 מ'', הנקודה הגבוהה ממערב לירדן; שביל הפסגה הוא סטייה של 15 דקות, ברז בחניון הפסגה), ואז ירידה ארוכה ביער האלונים של מירון דרך עין זבד ועין מירון עד Pitul Meron ליד כביש 866 (ק"מ 49, שולחנות וברז; תחנת האוטובוס מירון מרכז 500 מטר משם). משם השביל נכנס לשמורה ומגיע לחניון הלילה Nahal Amud בכניסה העליונה אחרי 2.6 ק"מ. שבת היא גם היום הראשון של ראש השנה: השמורה עובדת בשעות של שבת והחניון יהיה מלא, אז מזמינים כמה שיותר מוקדם; שם גם קונים את הכרטיס לשמורה ליום 4. מאמתים את שעות השער בחג ב-*3639 כשמזמינים. <b>אופציה ב'':</b> ישנים בחינם ב-Pitul Meron ונכנסים לשמורה ב-08:00, וזה מאריך את יום 4 בחצי שעה.'
    hours: 6
  - n: 4
    date: '2026-09-13'
    label: ראשון 13.9
    title: חניון הלילה Nahal Amud, בריכות שכווי, הקניון התחתון, Ginosar, הכנרת
    stats:
    - ≈20 ק"מ
    - +75 / −850 מ'
    - 8–9 h
    - סיום בחוף, −211 מ'; אוטובוס 59 מ-Ginosar
    text:
    - 'היום הטכני. השמורה נפתחת ב-08:00, אז זו היציאה המאוחרת היחידה. מהחניון דרך Ein Yakim לתוך הקניון העליון: שישה קילומטרים של סולמות, יתדות ברזל ואחיזות לצד מים זורמים, דרך Sechvi pools, עד טחנת הקמח העתיקה מתחת לאזור התעשייה של צפת (ק"מ 54, נקודת היציאה האחרונה עם אוטובוס). ממלאים 4 ליטר לכל אחד בברז של החניון: רט"ג אוסרים לשתות מהנחל ואין ברז עד החניון התחתון של Nahal Amud (ק"מ 61, מגודר, ברז). אחר כך הקטעים האמצעי והתחתון, סלעיים וחשופים, עם יתדות במקומות, מתייבשים ככל שיורדים מתחת לפני הים דרך העמוד והמערות, עד שער בריכות הדגים והחוף ב-Ginosar. רט"ג סוגרים את הקניון המלא בימי שרב, בימי גשם וביום שאחרי גשם: מתקשרים ל-*3639 בערב הקודם. ראשון 13 בספטמבר הוא היום השני של ראש השנה: אין סופרבוס 59 מתחנת Ginosar על כביש 90 עד צאת החג בסביבות 19:15, ואחריו שירות ערב דליל. מסדרים הסעה או מונית מטבריה ל-Ginosar, או שוחים בחוף חוקוק ולוקחים את ה-59 המאוחר לטבריה, ומשם אגד 430 לחיפה או 836 לתל אביב.'
    hours: 9
  plan_note: <b>מהר יותר?</b> החלוקה לשלושה ימים ישנה ב-Abirim וב-Pitul Meron ומסיימת ביום של 23 ק"מ דרך הקניון, וזה עובד רק עם שער ה-08:00 וקצב מהיר. <b>יום פנוי?</b> ישנים לילה שני בחניון התחתון של Nahal Amud ושוחים בחוף חוקוק (קמפינג חינם על הדשא, מקלחות, קיוסק, בלי מדורות).
  maps_intro: 'המפה מצוירת בזמן אמת מאותו קובץ GPX שאתם מורידים ל-OsmAnd, אז השניים לא יכולים להיות שונים. לחיצה על קו או נקודה מציגה את ההערה שלהם. כפתור השכבות מדליק ומכבה את המסלול וכל סוג של נקודת דרך. "איפה אני" מציג את המיקום שלכם, הקילומטר במסלול והמרחק לחניון הבא. "שמור את כל המסלול לאופליין" שומר את אריחי המפה בדפדפן; הדף וה-GPX נשמרים אוטומטית, אז האתר ממשיך לעבוד בלי קליטה. מפת הבסיס OpenTopoMap, לתכנון בלבד: קחו את מפת סימון השבילים 2, הגליל העליון 1:50,000, או את אפליקציית Israel Hiking Map.'
