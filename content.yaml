    text: כמעט כל הקו הוא שמורת טבע של רט"ג. ישנים רק בחניוני הלילה. השבילים פתוחים משעה אחרי הזריחה עד שעה לפני השקיעה. בלי כלבים בשבילים, בלי מדורות מחוץ למקומות המסומנים בחניונים, גזייה בסדר.
