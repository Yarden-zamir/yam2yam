en:
  eyebrow: Sea to Sea · Yam el Yam · Upper Galilee · 10 – 13 September 2026
  title: Sea to Sea Dossier
  lede: Yarden and Ayelet sleep at Achziv on Wednesday 9 September, walk four days east from the Mediterranean over Har Meron to the Kinneret with a tent, and get home from Ginosar on Sunday 13 September, the second day of Rosh Hashana. Their stage split, the camp rules, the water, the heat, and the Nahal Amud gate times that shape day 3 and day 4.
  facts:
  - value: ≈72 km
    label: Achziv → Ginosar
  - value: ≈1,550 m
    label: total ascent
  - value: ≈1,750 m
    label: total descent
  - value: 1,204 m
    label: high point, Har Meron
  - value: 4 days
    label: Thu 10 → Sun 13 Sep
  - value: 4 L
    label: water each for the Nahal Amud canyon
  plan_title: The plan
  plan_intro: 'The common four-day split, sleeping only in the official night camps because the whole line runs through nature reserves. Guidebook times plus about 20 %. Sunset is 18:52 at the start and 18:47 at the end, but the reserves close their trails an hour before it and September afternoons are hot, so walk at first light, 06:00, and be in camp by 15:00. Friday 11 to Sunday 13 September is Shabbat straight into Rosh Hashana: no buses from Friday noon until Sunday night, and full camps. The GPX in your Downloads folder carries these nights, the escapes and every OpenStreetMap tap and spring near the line.'
  snapshot_hint: 'One position fix, no tracking: marks finished days done and fills in today''s distance, ascent left and arrival estimate. Long-press to pick your position on the map instead. Tap a day title to see it on the map.'
  days:
  - n: 0
    date: '2026-09-09'
    label: WED 9 SEP
    title: Train to Nahariya → bus 22 → Achziv
    stats:
    - train to Nahariya, then 10 min by bus
    - campsite check-in by dusk, 18:52
    text:
    - 'Israel Railways to Nahariya, the last station on the coast line; the bus station is across the road. Nateev Express line 22 runs to the Achziv National Park stop about every half hour. Sleep in the Achziv National Park campsite (INPA, paid, book online, showers, no dogs) or for free in the eucalyptus grove behind the Yad LeYad memorial, 800 m north, with a tap at the memorial entrance; Betzet beach further north is the other free option. Buy four days of food in Nahariya: the only shops on the line are the fuel station at Elkosh bridge and the village of Hurfeish on day 2.'
  - n: 1
    date: '2026-09-10'
    label: THU 10 SEP
    title: Achziv → Nahal Kziv → Montfort → Ein Tamir → Abirim
    stats:
    - ≈20 km
    - +550 / −10 m
    - 7–8 h
    - free camp at Abirim, 546 m, tap, no toilets
    text:
    - 'Feet in the sea at 06:00, then east on farm tracks to the Nahal Kziv reserve at Ein Hardalit (km 8, shaded pools, a tap at the car park). The stream runs all year but INPA says do not drink it: fill at the Yad LeYad tap and at Ein Hardalit. The path climbs to Montfort, the Crusader castle on its spur (km 12, steps and a short scramble, no sleeping in the reserve), drops back to the water and follows it past the Dlavim pool to Ein Tamir (km 16), a spring at the end of a cut tunnel you can wade with a headtorch. Then the one climb of the day: 300 m up past Ein Ziv to the village of Abirim. The night camp is at the village entrance, with a tap and a bin and nothing else. Thursday is a normal day: buses still run on road 89 below the village if something goes wrong; from Friday noon they stop for the holiday weekend. <b>Behind schedule?</b> Goren Park (KKL, free, tap, toilets) sits above Montfort at km 14, 300 m off the line.'
    hours: 8
  - n: 2
    date: '2026-09-11'
    label: FRI 11 SEP
    title: Abirim → Elkosh bridge → the springs → Hurfeish → Horbat Hammama
    stats:
    - ≈19 km
    - +560 / −270 m
    - 7–8 h
    - INPA free camp at Horbat Hammama, 886 m, tap, toilets, fire spots
    text:
    - 'Rolling Galilee hills, no reserve gates. Down to Elkosh bridge on road 89 (km 29, fuel station shop 200 m, the popular unofficial camp there has no water), then up the wadi past a string of small springs: Ein Retet, Ein Tabaat, Ein Zevul and Ein Hotam (km 33, clear and pooled). Hurfeish (km 34) lies 1.5 km north of the line if you need a shop or a cafe; it is a Druze village, open on Friday and on Rosh Hashana. Buses on road 89 stop around 14:00 today for Shabbat and the holiday: from Elkosh bridge onward there is no bus until Sunday night. The afternoon climbs steadily to the foot of Har Meron. Horbat Hammama is the best camp on the trail: tables under the trees, a tap, toilets, and fires allowed in the marked spots. It is also the coolest night, 15–18 °C at 886 m in the open. The Har Meron field school next door has a paid camp with a kitchen and showers if the forecast turns.'
    hours: 8
  - n: 3
    date: '2026-09-12'
    label: SAT 12 SEP
    title: Horbat Hammama → Har Meron → Pitul Meron → Nahal Amud night camp
    stats:
    - ≈13 km
    - +340 / −600 m
    - 5–6 h
    - INPA paid camp, book online, check-in 15:00–19:00
    text:
    - 'The short day, on purpose: the Nahal Amud reserve admits walkers from Pitul Meron only between 08:00 and 14:30, and closes its trails at 16:00, so the canyon waits for the morning. 300 m of climb from camp to the summit plateau of Har Meron (1,204 m, the highest point west of the Jordan; the peak loop is 15 minutes off the line, tap at the summit car park), then a long descent through Meron''s oak forest past Ein Zeved and Ein Meron to Pitul Meron by road 866 (km 49, tables and a tap; Meron Center bus stop 500 m away). From there the trail enters the reserve and reaches the Nahal Amud night camp at the upper entrance in 2.6 km. Saturday is also the first day of Rosh Hashana: the reserve keeps its Saturday hours and the camp will be full, so book it as early as possible; it also sells the reserve ticket you need for day 4. Confirm the holiday gate hours on *3639 when you book. <b>Option B:</b> sleep free at Pitul Meron and enter the reserve at 08:00, which makes day 4 half an hour
      longer.'
    hours: 6
  - n: 4
    date: '2026-09-13'
    label: SUN 13 SEP
    title: Nahal Amud night camp → Sechvi pools → the lower canyon → Ginosar, the Kinneret
    stats:
    - ≈20 km
    - +75 / −850 m
    - 8–9 h
    - finish at the shore, −211 m; bus 59 from Ginosar
    text:
    - 'The technical day. The reserve opens at 08:00, so this is the one late start. From the camp past Ein Yakim into the upper canyon: six kilometres of ladders, iron pins and handholds beside running water, past the Sechvi pools, to the old flour mill below the Safed industrial zone (km 54, the last bail-out with a bus). Fill 4 L each at the camp tap: INPA forbids drinking from the stream and there is no tap until the lower Nahal Amud camp (km 61, fenced, tap). Then the middle and lower sections, rocky and exposed, bolted in places, drying out as you drop below sea level past the Amud pillar and the caves, to the fish-farm gate and the shore at Ginosar. INPA closes the full canyon on hot days, on rainy days and the day after rain: call *3639 the evening before. Sunday 13 September is the second day of Rosh Hashana: no bus 59 from the Ginosar stop on road 90 until the holiday ends about 19:15, and a thin evening service after it. Arrange a lift or a taxi from Tiberias to Ginosar, or swim
      at Hukok beach and take the late 59 to Tiberias, then Egged 430 to Haifa or 836 to Tel Aviv.'
    hours: 9
  plan_note: <b>Faster?</b> The three-day split sleeps at Abirim and Pitul Meron and finishes with a 23 km day through the canyon, which only works with the 08:00 gate and a fast pace. <b>Spare day?</b> Sleep a second night at the lower Nahal Amud camp and swim at Hukok beach (free camping on the grass, showers, shop, no fires).
  maps_intro: 'This map is drawn live from the same GPX you download for OsmAnd, so the two never differ. Tap any line or dot for its note. The layers button toggles the track and each kind of waypoint. "Where am I" shows your position, the kilometre on the route and the distance to the next camp. "Save whole route offline" stores the map tiles in the browser; the page and the GPX are stored automatically, so the site keeps working without signal. Base map OpenTopoMap, a planning aid: carry the SPNI trail map 2, Upper Galilee 1:50,000, or the Israel Hiking Map app.'
  section_maps:
  - key: overview
    caption: Whole route, north at top.
  - key: west
    caption: Days 1–2, Achziv to the foot of Har Meron.
  - key: east
    caption: Days 3–4, Har Meron and Nahal Amud to the Kinneret.
  rules_title: Rules and water
  rules:
  - title: 'Reserves:'
    text: almost the whole line is INPA nature reserve. Sleep only in the night camps. Trails are open from an hour after sunrise to an hour before sunset. No dogs on the trails, no fires outside the marked camp spots, stoves fine.
  - title: 'Nahal Amud (upper section, paid):'
    text: ticket and registration on parks.org.il. Entry from Pitul Meron 08:00–14:30 (Friday to 13:30), off the trails and the Sechvi pools by 16:00. No night walking. The reserve closes the long trail on hot days, on rain days and the day after rain. Check *3639 the evening before.
  - title: 'Water:'
    text: 'INPA says do not drink from Nahal Kziv or Nahal Amud. Taps: Yad LeYad, Ein Hardalit car park, Abirim, Horbat Hammama, Har Meron summit car park, Pitul Meron, the Nahal Amud camp, the lower Nahal Amud camp, Hukok beach. The dry stretch is the canyon: camp tap to the lower camp, 10 km, 4 L each in September. On a sharav day INPA closes the canyon anyway.'
  refuges:
    caption: Camps, water and where to pitch
    columns:
    - Place
    - Alt.
    - Status
    - Tent
    - Note
    rows:
    - - <a href="https://en.parks.org.il/camping/akhziv-campsite/">Achziv National Park campsite</a>
      - 5 m
      - INPA, paid, book online
      - night 0
      - 'showers, toilets, beach; free: Yad LeYad grove or Betzet beach'
    - - Goren Park
      - 220 m
      - KKL, free, tel 04-9950102
      - fallback day 1
      - tap, toilets, above Montfort, 300 m off the line
    - - Abirim
      - 546 m
      - free night camp
      - night 1
      - tap and a bin at the village entrance, no toilets
    - - Elkosh bridge
      - 500 m
      - unofficial, popular
      - fallback day 2
      - no water; fuel station shop 200 m
    - - <a href="https://www.tiuli.com/camping/338/%D7%97%D7%A8%D7%91%D7%AA-%D7%97%D7%9E%D7%9E%D7%94">Horbat Hammama</a>
      - 886 m
      - INPA, free, no booking
      - night 2
      - tap, toilets, fire spots; cold; Har Meron field school (paid, kitchen, showers) next door
    - - Pitul Meron
      - 655 m
      - free night camp
      - night 3 option B
      - tables, tap, by road 866, bus stop 500 m
    - - <a href="https://www.parks.org.il/camping/%D7%97%D7%A0%D7%99%D7%95%D7%9F-%D7%9C%D7%99%D7%9C%D7%94-%D7%A9%D7%9E%D7%95%D7%A8%D7%AA-%D7%98%D7%91%D7%A2-%D7%A0%D7%97%D7%9C-%D7%A2%D7%9E%D7%95%D7%93/">Nahal Amud night camp</a>
      - 530 m
      - INPA, paid (≈₪40–47 per adult), book online
      - night 3
      - check-in 15:00–19:00, out by 11:00; taps, toilets, electricity; sells the reserve ticket
    - - lower Nahal Amud camp
      - 5 m
      - free, renovated 2025
      - spare night
      - tap, tent platforms, chemical toilets, fenced; by the road, noisy
    - - <a href="https://ikinneret.org.il/beaches/%D7%97%D7%95%D7%A3-%D7%97%D7%95%D7%A7%D7%95%D7%A7-%D7%A6%D7%A4%D7%95%D7%9F/">Hukok north beach</a>
      - −210 m
      - declared beach, free on foot
      - after the finish
      - grass camping, showers, taps, shop; no fires or barbecues; 1.5 km north of the finish
  tech_title: Technical
  tech_intro: Nothing on the line needs a rope, but three parts are hands-on and the reports' injuries happen there. All of it is fine dry and none of it in rain.
  tech:
    caption: Technical sections and side trips
    columns:
    - Objective
    - Where
    - What it is
    - Time
    rows:
    - - Montfort castle
      - day 1, km 12
      - Steep steps and a short rock scramble up the spur to the Crusader ruin, then a steep path back to the stream. Big packs feel it.
      - on the line, +30 min
    - - Ein Tamir tunnel
      - day 1, km 16
      - A cut spring tunnel you can wade to its end with a headtorch; the last metres are a swim. Optional, 20 minutes, leave the packs with a partner.
      - optional, 20 min
    - - Har Meron summit loop
      - day 3, km 42
      - Paved loop around the peak, 1,204 m, view from the Hermon to the Kinneret. The summit itself is a military site.
      - +15 min
    - - Upper Nahal Amud canyon
      - day 4, km 52–54
      - Six kilometres of ladders, iron pins and handholds beside the stream, past the Sechvi pools. Wet rock at the pools. Not for anyone afraid of heights; fine for scramblers.
      - on the line, ≈3 h
    - - Middle and lower Nahal Amud
      - day 4, km 54–68
      - Rocky, exposed, bolted steps in places, then the pillar and the prehistoric caves. Hot in the afternoon; INPA closes it on hot days and after rain.
      - on the line, ≈4 h
  practical:
  - title: September
    items:
    - Coast and Kinneret 30–32 °C by day, 23–25 °C at night; Horbat Hammama at 886 m about 15–18 °C at night. A sharav pushes the coast past 35 °C and the mountains past 30 °C; INPA then closes the Nahal Amud long trail, and one September report gave up in 43 °C. Start at first light and rest through the early afternoon.
    - 'Rain is rare before late September, but a first storm is possible. Rain means no Nahal Amud: the canyon floods, and the reserve bans it on the day and the day after.'
    - Sunrise ≈06:18, sunset ≈18:50, civil dark ≈19:15. Israel is on summer time until 25 October.
    - <b>Live forecast:</b> each day card shows the current Open-Meteo forecast for that day's camp and high point, refreshed on every load, with warnings derived for storms, rain, wind, cold, heat, fog and UV. Open-Meteo forecasts 16 days ahead, so the cards are live for these dates. The last forecast is kept for offline reading.
    - <b>Official sources the evening before:</b> <a href="https://ims.gov.il/en/IMSwarnings">Israel Meteorological Service warnings</a>, <a href="https://www.parks.org.il/new/%D7%90%D7%96%D7%94%D7%A8%D7%AA-%D7%A9%D7%98%D7%A4%D7%95%D7%A0%D7%95%D7%AA/">INPA flood warnings</a>, and the INPA hotline *3639 for Nahal Amud.
  - title: Transport
    items:
    - 'To the start: train to Nahariya, then Nateev Express 22 (about every 30 min, ≈₪6–9) to the Achziv National Park stop, or a 4 km walk up the coast.'
    - 'From the finish: Superbus 59 from the Ginosar stop on road 90 to Tiberias (also stops at Hukok junction), then Egged 430 to Haifa or 836 to Tel Aviv (hourly, ≈2 h), 961/962 to Jerusalem.'
    - 'Shabbat runs straight into Rosh Hashana (12–13 September): no buses from Friday 11 September about 14:00 until Sunday 13 September about 19:15. Days 2, 3 and 4 are inside it, so the only bail-out then is a taxi, and the finish needs a lift or the late Sunday buses. Thursday 10 September is a normal day.'
    - 'Bail-outs with a bus: Manot-Avdon junction (km 5), Elkosh junction (km 29), Meron Center (km 49), Safed industrial zone (km 54), Kibbutz Hukok (km 66).'
  practical_right:
  - title: Gear
    items:
    - Sleeping system to 10 °C for Horbat Hammama; the other nights are warm.
    - 4 L capacity each; a filter for the springs if a tap fails.
    - Four days of food from Nahariya; shop stops at Elkosh bridge and Hurfeish.
    - Headtorch for Ein Tamir and the camp evenings. Water shoes or sandals for the pools.
    - 'Sun: hat, 50 SPF, the canyon and the Kinneret drop are exposed.'
    - 'Offline maps: OsmAnd with this GPX, plus the Israel Hiking Map app.'
    - Cash and a printed booking for the Nahal Amud camp and ticket.
    - 'Emergency: 100 police (hikers call 100 and stay put; the Galil-Carmel rescue unit is dispatched), 101 ambulance, 102 fire, INPA *3639.'
  links:
    reports:
    - <a href="https://shvilist.com/%D7%99%D7%9D-%D7%90%D7%9C-%D7%99%D7%9D/">Shvilist</a>, Hebrew, the stage table, the three- and four-day splits and the camp and water list this plan follows.
    - '<a href="https://www.ynet.co.il/vacation/israeltrips/article/ry114spf72">ynet, five days sea to sea</a>, Hebrew, the fullest report: Montfort, the Meron climb, the canyon ladders.'
    - <a href="https://hikingintheholyland.com/2020/06/16/yam-el-yam-day-1-nahal-kziv/">Hiking in the Holyland, day 1</a> (20.5 km, 9 h, +628 m) and <a href="https://hikingintheholyland.com/2020/06/23/yam-el-yam-day-3-nahal-amud-to-the-sea-of-galilee/">day 3</a> (23 km, 12 h from Pitul Meron, the fish-farm gate at the end).
    - '<a href="http://www.outdoorsfather.com/2016/09/yam-le-yam-trail-northern-israel/">Outdoors Father</a>, September in 43 °C, abandoned the last 10 km: the heat case.'
