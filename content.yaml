      - סלעי, חשוף, מדרגות עם יתדות במקומות, ואז העמוד והמערות הפרהיסטוריות. חם אחר הצהריים; רט"ג סוגרים בימי שרב ואחרי גשם.
      - על הקו, ≈4 שעות
  practical:
  - title: ספטמבר
    items:
    - בחוף ובכנרת 30–32 מעלות ביום, 23–25 בלילה; ב-Horbat Hammama ב-886 מטר בערך 15–18 בלילה. שרב מביא את החוף מעל 35 ואת ההרים מעל 30; אז רט"ג סוגרים את המסלול הארוך של Nahal Amud, ודיווח אחד מספטמבר ויתר ב-43 מעלות. יוצאים עם אור ראשון ונחים בשעות הצהריים.
    - 'גשם נדיר לפני סוף ספטמבר, אבל סופה ראשונה אפשרית. גשם אומר בלי Nahal Amud: הקניון מוצף, והשמורה אוסרת אותו ביום הגשם וביום שאחריו.'
    - זריחה ≈06:18, שקיעה ≈18:50, חושך ≈19:15. שעון קיץ עד 25 באוקטובר.
    - <b>תחזית חיה:</b> כל כרטיס יום מציג את התחזית הנוכחית של Open-Meteo לחניון ולנקודה הגבוהה של אותו יום, מתרעננת בכל טעינה, עם אזהרות שנגזרות לסופות, גשם, רוח, קור, חום, ערפל ו-UV. Open-Meteo חוזה 16 יום קדימה, אז הכרטיסים חיים לתאריכים האלה. התחזית האחרונה נשמרת לקריאה אופליין.
    - <b>מקורות רשמיים לערב הקודם:</b> <a href="https://ims.gov.il/he/warnings">אזהרות השירות המטאורולוגי</a>, <a href="https://www.parks.org.il/new/%D7%90%D7%96%D7%94%D7%A8%D7%AA-%D7%A9%D7%98%D7%A4%D7%95%D7%A0%D7%95%D7%AA/">אזהרות שיטפונות של רט"ג</a>, ומוקד רט"ג *3639 ל-Nahal Amud.
  - title: תחבורה
    items:
    - 'להתחלה: רכבת ל-Nahariya, ואז נתיב אקספרס 22 (בערך כל 30 דקות, ≈6–9 ₪) לתחנת גן לאומי אכזיב, או 4 ק"מ הליכה לאורך החוף.'
    - 'מהסיום: סופרבוס 59 מתחנת Ginosar על כביש 90 לטבריה (עוצר גם בצומת חוקוק), ומשם אגד 430 לחיפה או 836 לתל אביב (כל שעה, ≈שעתיים), 961/962 לירושלים.'
    - 'שבת נכנסת ישר לראש השנה (12–13 בספטמבר): אין אוטובוסים משישי 11 בספטמבר בסביבות 14:00 עד ראשון 13 בספטמבר בסביבות 19:15. ימים 2, 3 ו-4 בתוך זה, אז היציאה היחידה אז היא מונית, והסיום צריך הסעה או את האוטובוסים המאוחרים של ראשון. חמישי 10 בספטמבר הוא יום רגיל.'
    - 'יציאות עם אוטובוס: צומת מנות-עבדון (ק"מ 5), צומת Elkosh (ק"מ 29), מירון מרכז (ק"מ 49), אזור התעשייה צפת (ק"מ 54), קיבוץ חוקוק (ק"מ 66).'
  practical_right:
  - title: ציוד
    items:
    - שק שינה ל-10 מעלות בשביל Horbat Hammama; שאר הלילות חמים.
    - 4 ליטר נפח לכל אחד; פילטר למעיינות אם ברז לא עובד.
    - אוכל לארבעה ימים מ-Nahariya; חנויות ב-Elkosh bridge וב-Hurfeish.
    - פנס ראש ל-Ein Tamir ולערבים בחניון. נעלי מים או סנדלים לבריכות.
    - 'שמש: כובע, מקדם 50, הקניון והירידה לכנרת חשופים.'
    - 'מפות אופליין: OsmAnd עם ה-GPX הזה, פלוס אפליקציית Israel Hiking Map.'
    - מזומן והזמנה מודפסת לחניון ולכרטיס של Nahal Amud.
    - 'חירום: 100 משטרה (מטיילים מתקשרים 100 ונשארים במקום; יחידת החילוץ גליל-כרמל יוצאת), 101 מד"א, 102 כיבוי, רט"ג *3639.'
