    label: Achziv עד Ginosar
  - value: ≈1,550 מ'
    label: עלייה מצטברת
  - value: ≈1,750 מ'
    label: ירידה מצטברת
  - value: 1,204 מ'
    label: הנקודה הגבוהה, Har Meron
  - value: 4 ימים
    label: חמישי 10 עד ראשון 13 בספטמבר
  - value: 4 ליטר
    label: מים לכל אחד לקניון Nahal Amud
  plan_title: התוכנית
  plan_intro: 'החלוקה המקובלת לארבעה ימים, עם לינה רק בחניוני הלילה המוסדרים, כי כמעט כל המסלול עובר בשמורות טבע. זמני המדריכים פלוס בערך 20 אחוז. השקיעה ב-18:52 בהתחלה ו-18:47 בסוף, אבל השמורות סוגרות את השבילים שעה לפני ואחר הצהריים בספטמבר חם, אז יוצאים עם אור ראשון, 06:00, ומגיעים לחניון עד 15:00. שישי 11 עד ראשון 13 בספטמבר זה שבת שנכנסת ישר לראש השנה: אין אוטובוסים משישי בצהריים עד ראשון בערב, והחניונים מלאים. קובץ ה-GPX בתיקיית ההורדות כולל את הלילות האלה, נקודות היציאה וכל ברז ומעיין מ-OpenStreetMap ליד הקו.'
  snapshot_hint: 'קריאת מיקום אחת, בלי מעקב: מסמנת ימים שהסתיימו כהושלמו וממלאת את המרחק, העלייה שנותרה והערכת ההגעה להיום. לחיצה ארוכה בוחרת את המיקום במפה במקום GPS. לחצו על כותרת יום כדי לראות אותו במפה.'
  days:
