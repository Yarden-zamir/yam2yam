    - <a href="https://israelhiking.osm.org.il/">Israel Hiking Map</a>, <a href="https://www.openstreetmap.org/relation/2860967">the OpenStreetMap relation this GPX is built from</a>, <a href="https://moovitapp.com/index/en/public_transit-%D7%90%D7%9B%D7%96%D7%99%D7%91_%D7%9E%D7%95%D7%9C%D7%A8-Israel-stop_13962-1">Moovit, Achziv stop</a>, <a href="https://busnearby.co.il/%D7%A7%D7%95%D7%95%D7%99%D7%9D/%D7%9E%D7%97%D7%A6%D7%95%D7%A8%20%D7%94%D7%92%D7%9C%D7%99%D7%9C%D7%99%D7%AA%20%D7%9C%D7%98%D7%91%D7%A8%D7%99%D7%94/%D7%A1%D7%95%D7%A4%D7%A8%D7%91%D7%95%D7%A1/59/%D7%9C%D7%9B%D7%99%D7%95%D7%95%D7%9F%20%D7%AA%D7%97%D7%A0%D7%94%20%D7%9E%D7%A8%D7%9B%D7%96%D7%99%D7%AA/15615/6059">bus 59 timetable</a>.
