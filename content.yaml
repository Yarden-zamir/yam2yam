  - title: 'מים:'
    text: 'רט"ג אומרים לא לשתות מ-Nahal Kziv ומ-Nahal Amud. ברזים: Yad LeYad, חניון Ein Hardalit, Abirim, Horbat Hammama, חניון פסגת Har Meron, Pitul Meron, חניון הלילה Nahal Amud, החניון התחתון של Nahal Amud, חוף חוקוק. הקטע היבש הוא הקניון: מברז החניון עד החניון התחתון, 10 ק"מ, 4 ליטר לכל אחד בספטמבר. ביום שרב רט"ג סוגרים את הקניון בכל מקרה.'
